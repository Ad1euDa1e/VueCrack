<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --vue-dark: #35495e;
            --vue-green: #41b883;
            --vue-green-hover: #369870;
            --vue-green-pale: #f0f7f4;
            --gray-50: #f8f9fa;
            --gray-100: #f1f3f4;
            --gray-200: #e8eaed;
            --gray-300: #dadce0;
            --gray-400: #bdc1c6;
            --gray-500: #9aa0a6;
            --gray-600: #80868b;
            --gray-700: #5f6368;
            --gray-800: #3c4043;
            --gray-900: #202124;
        }

        * {
            box-sizing: border-box;
        }

        body {
            width: 480px;
            padding: 16px;
            margin: 0;
            background: var(--gray-100);
            color: var(--gray-800);
            font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', sans-serif;
            font-size: 13px;
            line-height: 1.5;
        }

        h2 {
            display: flex;
            align-items: center;
            margin: 0 0 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--gray-200);
            color: var(--vue-dark);
            font-size: 16px;
            font-weight: 600;
            line-height: 1.2;
        }

        h2 svg {
            width: 22px;
            height: 22px;
            margin-right: 10px;
            flex-shrink: 0;
        }

        h3 {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 18px 0 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--gray-200);
            color: var(--vue-dark);
            font-size: 14px;
            font-weight: 600;
            line-height: 1.35;
        }

        .all-in-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            border: 1px solid var(--gray-200);
            border-radius: 6px;
            background: #fff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .all-in-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--gray-900);
            font-size: 14px;
            font-weight: 600;
        }

        .all-in-status {
            margin-top: 4px;
            color: var(--gray-600);
            font-size: 12px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
            flex-shrink: 0;
        }

        .switch input {
            width: 0;
            height: 0;
            opacity: 0;
        }

        .switch-slider {
            position: absolute;
            inset: 0;
            cursor: pointer;
            background: var(--gray-400);
            border-radius: 999px;
            transition: background-color 0.2s ease;
        }

        .switch-slider:before {
            content: "";
            position: absolute;
            width: 16px;
            height: 16px;
            left: 3px;
            top: 3px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease;
        }

        .switch input:checked + .switch-slider {
            background: var(--vue-green);
        }

        .switch input:checked + .switch-slider:before {
            transform: translateX(18px);
        }

        .switch input:disabled + .switch-slider {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .route-count-badge {
            flex-shrink: 0;
            padding: 2px 8px;
            border-radius: 4px;
            background: var(--gray-100);
            color: var(--gray-700);
            font-family: 'SF Mono', SFMono-Regular, ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace;
            font-size: 12px;
            font-weight: 500;
        }

        .version-badge {
            display: inline-block;
            margin-left: 8px;
            padding: 2px 8px;
            border-radius: 4px;
            background: var(--vue-green-pale);
            color: var(--vue-green-hover);
            font-family: 'SF Mono', SFMono-Regular, ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace;
            font-size: 12px;
            font-weight: 600;
        }

        .status-indicators {
            margin: 16px 0;
        }

        .status-item {
            display: flex;
            align-items: center;
            margin: 0 0 8px;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.5;
        }

        .status-item svg {
            margin-right: 8px;
            flex-shrink: 0;
        }

        .success {
            border-left: 3px solid var(--vue-green);
            background: var(--vue-green-pale);
            color: var(--vue-green-hover);
        }

        .info {
            border-left: 3px solid var(--gray-400);
            background: var(--gray-50);
            color: var(--gray-700);
        }

        .error {
            border-left: 3px solid #d93025;
            background: #fce8e6;
            color: #b3261e;
        }

        .path-list {
            display: flex;
            flex-direction: column;
            max-height: 150px;
            margin: 10px 0;
            padding: 8px;
            overflow-y: auto;
            border: 1px solid var(--gray-200);
            border-radius: 6px;
            background: #fff;
        }

        .path-item {
            padding: 6px 10px;
            border-bottom: 1px solid var(--gray-100);
            font-family: 'SF Mono', SFMono-Regular, ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace;
            font-size: 12px;
            word-break: break-all;
        }

        .path-item:last-child {
            border-bottom: none;
        }

        .path-item:hover {
            background: var(--gray-50);
        }

        .path-mode-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 0 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--gray-200);
        }

        .path-mode-btn {
            flex: 0 1 auto;
            min-width: 0;
            max-width: 300px;
            padding: 6px 14px;
            overflow: hidden;
            border: 1px solid var(--gray-300);
            border-radius: 6px;
            background: #fff;
            color: var(--gray-700);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }

        .path-mode-btn:hover {
            border-color: var(--vue-green);
            background: var(--vue-green-pale);
            color: var(--vue-green-hover);
        }

        .path-mode-btn.active {
            border-color: var(--vue-green);
            background: var(--vue-green);
            color: #fff;
        }

        .url-section {
            margin-bottom: 16px;
            overflow: hidden;
            border: 1px solid var(--gray-200);
            border-radius: 6px;
            background: #fff;
        }

        .url-section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-bottom: 1px solid var(--gray-200);
            background: var(--gray-50);
            color: var(--gray-700);
            font-size: 13px;
            font-weight: 600;
        }

        .url-section-header svg {
            flex-shrink: 0;
        }

        .full-urls-list {
            display: flex;
            flex-direction: column;
            overflow: visible;
            background: #fff;
        }

        .full-url-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 16px 8px 13px;
            border-bottom: 1px solid var(--gray-100);
            border-left: 3px solid transparent;
            font-size: 13px;
            transition: background-color 0.15s ease;
        }

        .full-url-item:last-child {
            border-bottom: none;
        }

        .full-url-item:hover {
            background: var(--gray-50);
        }

        .full-url-item.current-route {
            border-left-color: var(--vue-green) !important;
            background: var(--vue-green-pale);
        }

        .url-main {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .url-text {
            flex: 1;
            min-width: 0;
            color: var(--gray-700);
            font-family: 'SF Mono', SFMono-Regular, ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace;
            font-size: 12px;
            line-height: 1.45;
            white-space: normal;
            word-break: break-all;
        }

        .url-domain {
            color: var(--gray-500);
            font-weight: 400;
        }

        .url-path {
            color: var(--gray-800);
            font-weight: 500;
        }

        .route-status-slot {
            width: 48px;
            min-width: 48px;
            display: flex;
            justify-content: flex-end;
            flex-shrink: 0;
        }

        .route-status-badge {
            flex-shrink: 0;
            padding: 0;
            border-radius: 4px;
            color: var(--vue-green-hover);
            font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', sans-serif;
            font-size: 11px;
            font-weight: 600;
            line-height: 1.2;
        }

        .route-status-badge.current {
            background: transparent;
            color: var(--vue-green-hover);
        }

        .route-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .url-copy-btn,
        .url-open-btn,
        .secondary-btn {
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
        }

        .url-copy-btn,
        .url-open-btn {
            padding: 4px 10px;
            border: 1px solid;
            font-size: 12px;
        }

        .url-copy-btn {
            border-color: var(--gray-300);
            background: #fff;
            color: var(--gray-700);
        }

        .url-copy-btn:hover {
            border-color: var(--gray-400);
            background: var(--gray-50);
            color: var(--gray-900);
        }

        .url-open-btn {
            border-color: var(--vue-green);
            background: var(--vue-green);
            color: #fff;
        }

        .url-open-btn:hover {
            border-color: var(--vue-green-hover);
            background: var(--vue-green-hover);
        }

        .url-copy-btn:active,
        .url-open-btn:active,
        .secondary-btn:active {
            transform: scale(0.98);
        }

        .copy-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--gray-200);
        }

        .secondary-btn {
            padding: 6px 14px;
            border: 1px solid var(--gray-300);
            background: #fff;
            color: var(--gray-700);
            font-size: 13px;
        }

        .secondary-btn:hover {
            border-color: var(--vue-green);
            background: var(--vue-green-pale);
            color: var(--vue-green-hover);
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            margin-right: 8px;
            border: 2px solid rgba(65, 184, 131, 0.22);
            border-top-color: var(--vue-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        .full-url-item.alternative {
            position: relative;
            margin-top: 0;
            padding-left: 13px;
            border-left: 3px solid var(--gray-300);
            background: var(--gray-50);
        }

        .alt-label {
            position: absolute;
            right: 10px;
            top: 6px;
            padding: 0;
            background: transparent;
            color: var(--gray-500);
            font-size: 11px;
        }

        .url-group {
            margin-bottom: 5px;
            border-left: 3px solid transparent;
        }

        .url-group.primary {
            border-left-color: var(--vue-green);
        }

        .url-copy-btn:focus-visible,
        .url-open-btn:focus-visible,
        .secondary-btn:focus-visible,
        .path-mode-btn:focus-visible,
        .switch input:focus-visible + .switch-slider {
            outline: 2px solid var(--vue-green);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
<h2>
    <svg width="20" height="20" viewBox="0 0 261.76 226.69" xmlns="http://www.w3.org/2000/svg">
        <path d="M161.096.001l-30.225 52.351L100.647.001H-.005l130.877 226.688L261.749.001z" fill="#41b883"/>
        <path d="M161.096.001l-30.225 52.351L100.647.001H52.346l78.526 136.01L209.398.001z" fill="#35495e"/>
    </svg>
    VueCrack
</h2>

<div class="all-in-panel">
    <div>
        <div class="all-in-title">梭哈模式</div>
        <div id="allInStatus" class="all-in-status">读取状态中...</div>
    </div>
    <label class="switch" title="刷新页面后生效">
        <input id="allInToggle" type="checkbox">
        <span class="switch-slider"></span>
    </label>
</div>

<div id="routerAnalysisContainer"></div>
<div id="pathListContainer"></div>

<script src="popup.js"></script>
</body>
</html>
